name: Build and verify ClipVault
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build and test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev xvfb xauth dbus-x11 xclip
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo test -p clipvault-core --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Real X11 clipboard roundtrip
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum cargo test -p clipvault --locked linux_x11 -- --ignored --test-threads=1
      - name: Build installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Optional macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            npm run tauri -- build --target ${{ matrix.target }} --bundles app,dmg
          fi
      - name: Archive the Mac app
        if: runner.os == 'macOS'
        run: tar -czf target/${{ matrix.target }}/release/bundle/ClipVault-${{ matrix.target }}.app.tar.gz -C target/${{ matrix.target }}/release/bundle/macos ClipVault.app
      - uses: actions/upload-artifact@v4
        with:
          name: ClipVault-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/ClipVault-${{ matrix.target }}.app.tar.gz
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: ClipVault-GNOME-helper
          path: extensions/clipvault/

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ClipVault-*
          path: artifacts
      - name: Prepare downloadable packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          find artifacts -type f \( \
            -name '*.dmg' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.app.tar.gz' \
          \) -exec cp {} release/ \;
          tar -czf "release/ClipVault-${GITHUB_REF_NAME}-Arch-PKGBUILD.tar.gz" \
            packaging/arch/PKGBUILD packaging/clipvault.desktop
          tar -czf "release/ClipVault-${GITHUB_REF_NAME}-GNOME-helper.tar.gz" \
            -C extensions clipvault
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
